# notify_skip.conf
# Configuration file for the notify_skip script

# Enable/disable automatic skipping (currently not implemented)
auto_skip=no

# Categories of chapters to skip (semicolon-separated)
skip_categories=opening;ending;preview;recap

# Blackdetect parameters for notifications (less sensitive)
blackdetect_notify_args=d=0.1:pic_th=0.90:pix_th=0.15

# Blackdetect parameters for skipping (more sensitive)
blackdetect_skip_args=d=0.5:pic_th=0.80:pix_th=0.20

# Silencedetect parameters for notifications
silencedetect_notify_args=n=-30dB:d=0.5

# Silencedetect parameters for skipping
silencedetect_skip_args=n=-30dB:d=1.0

# Show skip notifications
show_notification=yes

# Duration to show notifications (in seconds)
notification_duration=15

# Time window to look ahead for chapters (in seconds)
skip_window=1

# Maximum duration for a skip (in seconds, prevents skipping entire episodes)
max_skip_duration=300

# Regex patterns for opening chapters
opening_patterns=^OP$|^OP[0-9]+$|^Opening|Opening$|^Intro|Intro$|^Introduction$|^Theme Song$|^Main Theme$|^Title Sequence$|^Cold Open$|^Teaser$

# Regex patterns for ending chapters
ending_patterns=^ED$|^ED[0-9]+$|^Ending|Ending$|^Outro|Outro$|^End Credits$|^Credits$|^Closing|Closing$|^Epilogue$|^End Theme$|^Closing Theme$

# Regex patterns for preview chapters
preview_patterns=Preview|Next Episode|^Next Time|^Coming Up|^Next Week|^Trailer$

# Regex patterns for recap chapters
recap_patterns=^Recap$|^Previously|Previously$|^Last Time|Last Time$|^Summary$|^Story So Far$