# This file is used to configure the quality of the video

#=============================================================================
#                            GPU API
#=============================================================================
gpu-api=vulkan
vulkan-async-compute=yes
vulkan-async-transfer=yes

#=============================================================================
#                            VIDEO PROFILES
#=============================================================================
profile = high-quality			# mpv --show-profile=gpu-hq
hwdec = auto		# enable hardware decoding, defaults to 'no'
vo = gpu-next			# GPU-Next: https://github.com/mpv-player/mpv/wiki/GPU-Next-vs-GPU

# Optimized for i5-9300H (4 cores/8 threads) + GTX 1650
vd-lavc-threads=0  					# Let FFmpeg auto-detect (better than fixed 4)
vd-lavc-dr=yes

# Dither
#dither-depth = auto
# Dither optimized for gpu-next
dither=fruit
dither-depth=auto
temporal-dither-period=1

# Debanding
deband = no
#deband-iterations = 4
#deband-threshold = 35
#deband-range = 16
#deband-grain = 4

# Better scaling and antiring
scale-antiring=0.7
cscale-antiring=0.7
dscale-antiring=0.7
correct-downscaling=yes
sigmoid-upscaling=yes				# Prevents ringing/aliasing artifacts during upscaling.

# Colors - Universal compatibility
target-contrast=auto
gamma=0
brightness=0
contrast=0
saturation=0
video-output-levels=auto

#########################################################################
# ICC PROFILE CONFIGURATION:
#
# Default: DISABLED for broader compatibility
# - Most users have uncalibrated displays where ICC makes colors washed out
# - Gaming monitors especially benefit from ICC being disabled
# 
# ENABLE ICC if you have:
# - A professionally calibrated monitor
# - An OLED display (usually handles ICC well)
# - Prefer color accuracy over vibrant colors
#
# To enable: Change "icc-profile-auto=no" to "icc-profile-auto=yes" below
#########################################################################

icc-profile-auto=no					# Disabled by default, try out and see if you like it
									# I use it on my OLED TV, but not on my PC monitor

# OSD
osd-font=JetBrains Mono
osd-font-size=25
osd-color=0.0/0.0/0.0/1.0  			# Black text body
osd-outline-size=1.5
osd-outline-color=1.0/1.0/1.0/1.0 	# White outline
osd-blur=0.1
osd-align-x=center
osd-bar=no
osd-margin-y=50
osd-duration=3000
osd-scale-by-window=yes
script-opts=console-font_size=10

# Playback optimizations
force-seekable=yes
hr-seek-framedrop=no
interpolation=no  					# Disabled since we use SVP
#video-sync=display-resample  		# Better frame timing, but forces FPS to match your display
									# Disabled for more control through SVP

# Luma up (uncomment one shader line only)	See: https://artoriuz.github.io/blog/mpv_upscaling.html
#glsl-shader = "~~/shaders/ravu-zoom-ar-r3-rgb.hook"		# good balance between performance and quality
#scale = ewa_lanczos
#scale-blur = 0.981251

# Luma down (optional, uncomment shader line if your hardware can support it)
#dscale = catmull_rom
#correct-downscaling = yes
#linear-downscaling = no

# Chroma up + down (optional, uncomment one shader line only if your hardware can support it)
#glsl-shader = "~~/shaders/JointBilateral.glsl"
#glsl-shader = "~~/shaders/FastBilateral.glsl"
#glsl-shader = "~~/shaders/CfL_Prediction.glsl"
#cscale = lanczos
#sigmoid-upscaling = yes

# Interpolation (original settings commented since we use SVP)
#video-sync = display-resample
#interpolation = yes
#tscale = sphinx
#tscale-blur = 0.6991556596428412
#tscale-radius = 1.05
#tscale-clamp = 0.0

# SDR
#tone-mapping = bt.2446a

# HDR
#target-colorspace-hint = yes

# OSD
osd-font=JetBrains Mono
osd-font-size=25
osd-color=0.0/0.0/0.0/1.0  			# Black text body
osd-outline-size=1.5
osd-outline-color=1.0/1.0/1.0/1.0 	# White outline
osd-blur=0.1
osd-align-x=center
osd-bar=no
osd-margin-y=50
osd-duration=3000
osd-scale-by-window=yes
script-opts=console-font_size=10

# Playback optimizations
force-seekable=yes
hr-seek-framedrop=no
interpolation=no  					# Disabled since we use SVP
#video-sync=display-resample  		# Better frame timing, but forces FPS to match your display
									# Disabled for more control through SVP

#=============================================================================
#                            PLAYBACK
#=============================================================================
deinterlace = no # global reset of deinterlacing to off
force-seekable=yes
hr-seek-framedrop=no

[default]
# apply all luma and chroma upscaling and downscaling settings
# apply motion interpolation (disabled for SVP compatibility)

############################## ENHANCED PROFILES ##############################

[anime-base]

glsl-shaders-clr
vf-clr

# Audio Filter for Anime
# - gentle loudness normalization
# - mild compression 
# - removes sub-bass rumble, keeps small impact sounds 
# - preserves high-frequency detail

af-append=@ANIME:lavfi=[loudnorm=I=-16:TP=-1:LRA=6,acompressor=threshold=0.0625:ratio=2:attack=20:release=200:makeup=1.2,highpass=f=60,lowpass=f=18000]

# Enhanced scaling
scale=ewa_lanczos
scale-radius=3.2239449
scale-blur=0.981251
dscale=mitchell
cscale=ewa_lanczos
correct-downscaling=yes
linear-downscaling=no

# Colors							# optional: subtle color "pop"
target-prim=auto 
target-trc=gamma2.2
gamma=-2
brightness=-2
contrast=-2
saturation=2

# Anime-specific optimizations
hwdec=auto-copy						# Enable hardware decoding for better SVP performance
temporal-dither=yes  				# Better with Anime4K
video-reversal-buffer=100000000 	# Reduced for SVP efficiency
vd-queue-enable=yes
vd-queue-max-bytes=768MiB  			# Reduced from 1536MiB for SVP
vd-queue-max-samples=30 			# Reduced from 60
vd-queue-max-secs=60 				# Reduced from 900

# Temporal + Spatial Denoising Filter (reduces banding) + SVP Frame Rate Conversion Optimized for 48 FPS
vf=@HQDN3D:lavfi=[hqdn3d=luma_spatial=3:chroma_spatial=2:luma_tmp=5],@SVP:vapoursynth="~~/svp/svp_main.vpy":buffered-frames=8:concurrent-frames=8

# Anime4k: Optimized for 4K Displays on Low-End Specs
glsl-shaders="~~/shaders/denoise3.glsl;~~/shaders/Anime4K_Clamp_Highlights.glsl;~~/shaders/Anime4K_Restore_CNN_M.glsl;~~/shaders/Anime4K_Upscale_CNN_x2_M.glsl;~~/shaders/Anime4K_Upscale_Denoise_CNN_x2_M.glsl;~~/shaders/Anime4K_AutoDownscalePre_x2.glsl;~~/shaders/Anime4K_Thin_Fast.glsl;~~/shaders/dither_anime_bayer_luma.glsl"

###########################################################################

[movies-tv]

glsl-shaders-clr
vf-clr

# Cinematic Audio Filter for Movies & TV
# - moderate loudness normalization 
# - gentle but noticeable compression 
# - allows deeper bass for cinematic impact 
# - keeps full high end 
# - slight low-end boost for cinematic feel 
# - slight high-end boost

af-append=@CINEMA:lavfi=[highpass=f=40,bass=g=3:f=100:t=s,acompressor=ratio=2:threshold=0.125:makeup=2,equalizer=f=3000:t=q:w=1.5:g=2]

# hwdec=auto-copy					# Enable this only if you plan to use any vf for movies

# Scaling optimized for live-action
scale=spline36
cscale=mitchell

############################## AUTO PROFILES ##############################



[anime-sdr]

profile=anime-base
profile-restore=copy

osd-playing-msg=• Profile ⇨ [Anime] •# : ${media-title}

###########################################################################



[sdr]
 
profile=movies-tv
profile-restore=copy

osd-playing-msg=• Profile ⇨ [🎬] •# : ${media-title}

# SDR movies/TV profile
tone-mapping=bt.2446a        	# balanced, good highlight roll-off
tone-mapping-param=0.8       	# adjust highlight compression strength
 
# SDR movie enhancements
target-prim=auto 
target-trc=auto
contrast=7        				# more punch for cinematic content  
saturation=2     				# subtle color boost
gamma=0.93       				# lift shadows slightly

#=============================================================================
#                            PROTOCOL SPECIFIC CONFIG
#=============================================================================
[protocol.http]
hls-bitrate = max # use max quality for HLS streams
cache = yes
no-cache-pause # don't pause when the cache runs low

[protocol.https]
profile = protocol.http

[protocol.ytdl]
profile = protocol.http
