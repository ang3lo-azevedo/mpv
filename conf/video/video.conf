log-file=LOG.txt

#########
#  OSD  #
#########

osd-font=JetBrainsMono NF
osd-font-size=25
osd-color=0.0/0.0/0.0/1.0  			# Black text body
osd-outline-size=1.5
osd-outline-color=1.0/1.0/1.0/1.0 	# White outline  
osd-blur=0.1
osd-align-x=center
osd-bar=no
osd-margin-y=50
osd-duration=3000
osd-scale-by-window=yes
script-opts=console-font_size=10

#########
# Cache #
#########

gpu-shader-cache-dir=~~/cache/shaders
icc-cache-dir=~~/cache/icc

# OPTIMIZED FOR STREAMING
cache=yes
cache-secs=900
demuxer-readahead-secs=180
demuxer-max-back-bytes=150MiB
demuxer-max-bytes=300MiB
stream-buffer-size=64MiB
demuxer-seekable-cache=yes

# Network resilience for unstable streams
stream-lavf-o=reconnect=1,reconnect_streamed=1,reconnect_delay_max=5

########
# Subs #
########

embeddedfonts=yes
# sub-ass-override=no

#########################################################################
# SUBTITLE BACKGROUND CONFIGURATION:									#
#																		#
# DEFAULT: 'outline-and-shadow'											#
# - This creates an outline and a drop shadow.							#
# 																		#
# ENABLE 'background-box' if you want a box instead.					#
# To enable: Remove the '#' from 'sub-border-style' below				#
#########################################################################

#sub-border-style=background-box

###########################################################################
# TOP-LEVEL BASELINE DEFAULTS
# These are the "initial values" that reset-on-next-file will reset TO.
###########################################################################

# Core rendering
gpu-api=vulkan
profile=high-quality
vo=gpu-next
vd-queue-enable=no
allow-delayed-peak-detect=yes       # Prevents first-frame brightness flash on HDR content

# Colorspace defaults (profile-manager.lua handles HDR/SDR specifics dynamically)
target-prim=auto
target-trc=auto
target-contrast=auto

# Deband defaults
deband=yes
deband-iterations=2
deband-threshold=35
deband-range=16
deband-grain=6                      # Prevents plastic look after debanding on well-encoded streams

# Dither settings
dither=fruit
dither-depth=10
temporal-dither=yes
temporal-dither-period=1

# Scaling defaults
scale=ewa_lanczossharp              # Best general-purpose upscaling (developer-recommended for gpu-next)
cscale=ewa_lanczossharp             # Polar chroma upscaling
dscale=hermite                      # Zero-ringing downscaling (best for 4K→1080p)
scale-antiring=0.6
# cscale-antiring and dscale-antiring are no-ops in vo=gpu-next
sigmoid-upscaling=yes
linear-downscaling=no               # Clips HDR highlights in gpu-next pipeline if enabled
correct-downscaling=yes

############################## PROFILES ##############################
# Profiles OVERRIDE the baseline above.
######################################################################

[sdr]
# Scaling for live-action (spline36 handles ringing in real content better than ewa)
scale=spline36
cscale=ewa_lanczossharp

# Smooth 24fps on high-refresh displays via frame interpolation
video-sync=display-resample
interpolation=yes
tscale=oversample                   # Lightweight, artifact-free interpolation for film cadence

###########################################################################

[anime-sdr]
# Decoder Settings - CRITICAL FOR STREAMING + SVP
hwdec=auto-copy                     # Copy decoded frames to RAM for VapourSynth/SVP access
hr-seek-framedrop=no                # Prevents desync after seeks with SVP
video-latency-hacks=yes             # Reduces initial buffering with heavy filter chains
mc=0                                # Disables A/V timestamp correction that fights SVP
autosync=30                         # Stabilize startup A/V sync during heavy filter init
video-sync=audio                    # Let SVP manage its own frame timing

# Video Queue - for streaming stability with SVP
vd-queue-enable=yes
vd-queue-max-bytes=512MiB
vd-queue-max-samples=35
vd-queue-max-secs=60

# Scaling (ewa_lanczossharp has optimal blur baked in — no manual radius/blur needed)
scale=ewa_lanczossharp
cscale=ewa_lanczossharp

# Deband tuned for anime gradients
deband-iterations=2
deband-threshold=45
deband-range=16
deband-grain=20

# NOTE: Shaders, VF chains (hqdn3d + SVP), and HDR handling are applied
# dynamically by profile-manager.lua based on content type.
#
# Shader presets: optimized | fast | hq
# VF chains: hqdn3d + SVP (standard) | BWDIF + SVP (legacy interlaced ≤576p)

###########################################################################
