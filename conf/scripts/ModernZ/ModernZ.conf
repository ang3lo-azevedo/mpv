# This file is used to configure the ModernZ OSC

osc = no # Disable the default osc.lua
osd-bar = no # Disable the osd bar

#=============================================================================
#                            MODERNZ SCRIPT-OPTS
#=============================================================================
script-opts-append = modernz-timetotal=no # Show the remaining time instead of the total time
script-opts-append = modernz-time_format=fixed # Always show the time in the format HH:MM:SS

# Colors and style - Changed to white theme to match dotfiles
script-opts-append = modernz-seekbarfg_color=#FFFFFF # Seekbar progress color (white instead of orange)
script-opts-append = modernz-hover_effect_color=#FFFFFF # Button hover effect color (white instead of orange)
script-opts-append = modernz-osc_color=#000000 # OSC background accent color (black)
script-opts-append = modernz-seekbarbg_color=#333333 # Seekbar background color (dark gray)